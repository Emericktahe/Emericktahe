<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<defs>

  <!-- FOND SPATIAL -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#000000"/>
    <stop offset="0.4" stop-color="#05001a"/>
    <stop offset="0.8" stop-color="#0a0030"/>
    <stop offset="1" stop-color="#000000"/>
  </linearGradient>

  <!-- DÉGRADÉ NOM -->
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.5" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#00f0ff"/>
  </linearGradient>

  <!-- DÉGRADÉ LIGNE -->
  <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00000000"/>
    <stop offset="0.2" stop-color="#7b2ff7"/>
    <stop offset="0.5" stop-color="#00f0ff"/>
    <stop offset="0.8" stop-color="#7b2ff7"/>
    <stop offset="1" stop-color="#00000000"/>
  </linearGradient>

  <!-- GLOW VIOLET -->
  <radialGradient id="glowLeft" cx="0.25" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7b2ff7" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
  </radialGradient>

  <!-- GLOW CYAN -->
  <radialGradient id="glowRight" cx="0.85" cy="0.4" r="0.45">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
  </radialGradient>

  <!-- GRILLE POINTS -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.06"/>
  </pattern>

  <!-- FILTRE GLOW -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="glowStrong">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <style>
    /* ÉTOILES */
    .star { animation: twinkle 3s ease-in-out infinite; fill: #ffffff; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.5s; }
    .s3 { animation-delay: 1s; }
    .s4 { animation-delay: 1.5s; }
    .s5 { animation-delay: 2s; }
    .s6 { animation-delay: 2.5s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; r: 1; }
      50% { opacity: 1; r: 2; }
    }

    /* PLANÈTES */
    .planet1 { animation: orbit1 20s linear infinite; }
    .planet2 { animation: orbit2 14s linear infinite; }
    @keyframes orbit1 {
      0%   { transform: translate(1050px, 80px) rotate(0deg) translateX(40px); }
      100% { transform: translate(1050px, 80px) rotate(360deg) translateX(40px); }
    }
    @keyframes orbit2 {
      0%   { transform: translate(1100px, 200px) rotate(0deg) translateX(25px); }
      100% { transform: translate(1100px, 200px) rotate(-360deg) translateX(25px); }
    }

    /* ANNEAU PLANÈTE */
    .ring { animation: ringPulse 4s ease-in-out infinite; }
    @keyframes ringPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* LIGNE NÉON */
    .neonLine { animation: neonPulse 2.5s ease-in-out infinite; }
    @keyframes neonPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* TEXTE PRINCIPAL */
    .nameText {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 82px;
      fill: url(#nameGrad);
      letter-spacing: 8px;
      filter: url(#glowStrong);
    }

    /* ALIAS -->
    .aliasText {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      fill: #7b2ff7;
      letter-spacing: 4px;
    }

    /* SOUS-TITRE */
    .subText {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 300;
      font-size: 20px;
      fill: #aaaaaa;
      letter-spacing: 2px;
    }

    /* BADGES PILLS */
    .pillText {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e0e0ff;
    }

    /* CURSEUR CLIGNOTANT */
    .cursor { animation: blink 1s steps(1) infinite; fill: #00f0ff; }
    @keyframes blink { 50% { opacity: 0; } }

    /* LIGNE CODE */
    .codeText {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      fill: #00f0ff;
      opacity: 0.7;
    }

    /* PARTICULES FLOTTANTES */
    .particle { animation: float 6s ease-in-out infinite; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 1s; }
    .p3 { animation-delay: 2s; }
    .p4 { animation-delay: 3s; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); opacity: 0.4; }
      50% { transform: translateY(-12px); opacity: 1; }
    }

    /* SCAN LINE */
    .scanLine { animation: scan 4s linear infinite; }
    @keyframes scan {
      0% { transform: translateY(-340px); opacity: 0; }
      10% { opacity: 0.05; }
      90% { opacity: 0.05; }
      100% { transform: translateY(340px); opacity: 0; }
    }
  </style>
</defs>

<!-- FOND -->
<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#grid)"/>
<rect width="1200" height="340" fill="url(#glowLeft)"/>
<rect width="1200" height="340" fill="url(#glowRight)"/>

<!-- SCAN LINE EFFET -->
<rect class="scanLine" width="1200" height="2" fill="#00f0ff"/>

<!-- ÉTOILES ANIMÉES -->
<circle class="star s1" cx="80"  cy="30"  r="1.5"/>
<circle class="star s2" cx="200" cy="15"  r="1"/>
<circle class="star s3" cx="350" cy="45"  r="2"/>
<circle class="star s4" cx="500" cy="20"  r="1.5"/>
<circle class="star s5" cx="650" cy="50"  r="1"/>
<circle class="star s6" cx="750" cy="10"  r="2"/>
<circle class="star s1" cx="150" cy="290" r="1.5"/>
<circle class="star s2" cx="300" cy="310" r="1"/>
<circle class="star s3" cx="450" cy="300" r="2"/>
<circle class="star s4" cx="600" cy="320" r="1"/>
<circle class="star s5" cx="700" cy="280" r="1.5"/>
<circle class="star s6" cx="820" cy="315" r="1"/>
<circle class="star s1" cx="50"  cy="160" r="1"/>
<circle class="star s3" cx="120" cy="200" r="1.5"/>
<circle class="star s5" cx="780" cy="100" r="1"/>
<circle class="star s2" cx="830" cy="270" r="1.5"/>

<!-- PLANÈTE 1 — GRANDE VIOLETTE -->
<g class="planet1">
  <circle r="0" cx="0" cy="0" fill="none"/>
</g>
<circle cx="1060" cy="90" r="38" fill="#1a0050" stroke="#7b2ff7" stroke-width="1.5" filter="url(#glow)"/>
<circle cx="1060" cy="90" r="38" fill="none" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.5"/>
<!-- Détails planète -->
<ellipse cx="1060" cy="90" rx="38" ry="10" fill="none" stroke="#7b2ff7" stroke-width="1" stroke-opacity="0.6" class="ring"/>
<circle cx="1048" cy="80" r="6" fill="#2a0070" opacity="0.8"/>
<circle cx="1070" cy="98" r="4" fill="#2a0070" opacity="0.6"/>

<!-- PLANÈTE 2 — PETITE CYAN -->
<circle cx="1130" cy="230" r="20" fill="#001a20" stroke="#00f0ff" stroke-width="1" filter="url(#glow)"/>
<ellipse cx="1130" cy="230" rx="28" ry="6" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.5" class="ring"/>

<!-- PLANÈTE 3 — MINUSCULE -->
<circle cx="980" cy="280" r="8" fill="#0a0020" stroke="#7b2ff7" stroke-width="0.8" opacity="0.7"/>

<!-- PARTICULES FLOTTANTES -->
<circle class="particle p1" cx="900" cy="60"  r="2" fill="#7b2ff7" filter="url(#glow)"/>
<circle class="particle p2" cx="940" cy="150" r="1.5" fill="#00f0ff" filter="url(#glow)"/>
<circle class="particle p3" cx="870" cy="250" r="2" fill="#a78bfa" filter="url(#glow)"/>
<circle class="particle p4" cx="920" cy="300" r="1.5" fill="#00f0ff" filter="url(#glow)"/>

<!-- LIGNE NÉON HAUT -->
<rect class="neonLine" x="0" y="0" width="1200" height="2" fill="url(#lineGrad)"/>

<!-- LIGNE NÉON BAS -->
<rect class="neonLine" x="0" y="338" width="1200" height="2" fill="url(#lineGrad)"/>

<!-- LIGNE SÉPARATRICE MILIEU -->
<rect x="60" y="195" width="700" height="1" fill="url(#lineGrad)" opacity="0.4"/>

<!-- CONTENU TEXTE -->

<!-- TAG CODE -->
<text class="codeText" x="62" y="58">&lt;EME.dev&gt;</text>

<!-- NOM PRINCIPAL -->
<text class="nameText" x="58" y="160">EMERICK TAHE</text>

<!-- SOUS-TITRE -->
<text class="subText" x="64" y="218">Junior Developer  ·  Flutter  ·  Laravel  ·  SQL  ·  Côte d'Ivoire 🌍</text>

<!-- PILLS BADGES -->
<g transform="translate(62, 245)">
  <!-- Flutter -->
  <rect x="0" width="80" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6"/>
  <text class="pillText" x="40" y="19" text-anchor="middle">Flutter</text>

  <!-- Dart -->
  <rect x="92" width="60" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6"/>
  <text class="pillText" x="122" y="19" text-anchor="middle">Dart</text>

  <!-- Laravel -->
  <rect x="164" width="80" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#7b2ff7" stroke-width="0.8" stroke-opacity="0.6"/>
  <text class="pillText" x="204" y="19" text-anchor="middle">Laravel</text>

  <!-- PHP -->
  <rect x="256" width="55" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#7b2ff7" stroke-width="0.8" stroke-opacity="0.6"/>
  <text class="pillText" x="283" y="19" text-anchor="middle">PHP</text>

  <!-- SQL -->
  <rect x="323" width="55" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6"/>
  <text class="pillText" x="350" y="19" text-anchor="middle">SQL</text>

  <!-- Open to work -->
  <rect x="390" width="120" height="28" rx="14" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="0.8"/>
  <circle cx="408" cy="14" r="4" fill="#00ff88"/>
  <text class="pillText" x="450" y="19" text-anchor="middle" fill="#00f0ff">Open to work</text>
</g>

<!-- TAG FERMETURE + CURSEUR -->
<text class="codeText" x="62" y="310">&lt;/EME.dev&gt;</text>
<rect class="cursor" x="152" y="296" width="10" height="16" rx="1"/>

</svg>
